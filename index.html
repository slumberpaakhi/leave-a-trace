<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leaving a trace | every step matters</title>
    <script src="https://js.pusher.com/8.3.0/pusher.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body data-theme="dark">
    <!-- identity setup modal -->
    <div id="identity-modal" class="modal">
        <div class="modal-content">
            <h2>identify yourself.</h2>
            <div id="setup-avatar-preview" class="pixel-avatar-small"
                style="margin: 0 auto 1.5rem auto; width: 64px; height: 64px;"></div>
            <p>provide your identity to begin.</p>
            <input type="text" id="nickname-input" placeholder="enter nickname (required)..." maxlength="15">
            <input type="password" id="user-password-input" placeholder="enter password (required, min 4)...">
            <button id="save-identity">enter the world</button>
        </div>
    </div>

    <!-- admin login modal -->
    <div id="admin-modal" class="modal hidden">
        <div class="modal-content">
            <h2>administrator access.</h2>
            <p>restricted world management</p>
            <input type="password" id="admin-password-input" placeholder="enter passphrase...">
            <button id="admin-login-btn">identify admin</button>
            <p id="admin-login-error" style="color: #d63031; font-size: 0.7rem; margin-top: 1rem; opacity: 0;"></p>
        </div>
    </div>

    <div id="app">
        <header>
            <div class="philosophical-header">
                <h1>everything leaves a trace.</h1>
                <p>wherever you go, you leave a part of yourself behind.</p>
                <button id="reset-btn" class="reset-link">clear this world</button>
            </div>
            <div class="top-right-controls">
                <button id="theme-toggle" class="icon-btn" aria-label="toggle theme">
                    <span class="mode-icon"></span>
                </button>
            </div>
        </header>

        <main id="trace-container">
            <div id="canvas-viewport">
                <div id="remote-cursors-layer" style="position: absolute; top:0; left:0; pointer-events: none;"></div>
                <canvas id="trace-canvas"></canvas>
            </div>

            <!-- hover tooltip -->
            <div id="trace-tooltip" class="tooltip hidden">
                <div id="tooltip-avatar" class="pixel-avatar-small"></div>
                <span id="tooltip-nickname"></span>
            </div>

            <div id="interface-overlay">
                <div class="controls-container sketchy-toolbar">
                    <button id="undo-btn" class="tool-btn" title="undo">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z" />
                        </svg>
                    </button>
                    <button id="redo-btn" class="tool-btn" title="redo">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z" />
                        </svg>
                    </button>
                    <div class="tool-divider"></div>
                    <button id="pan-btn" class="tool-btn" title="pan world">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M18 11V7a2 2 0 0 0-4 0v3h-1V5a2 2 0 0 0-4 0v5h-1V6a2 2 0 0 0-4 0v6.1c-.9.2-1.6.8-1.9 1.7l-1.1 3.2c-.3 1 .1 2.1.9 2.8l2.9 2.5a4 4 0 0 0 2.6 1L17 23a3 3 0 0 0 3-3V13a2 2 0 0 0-2-2z" />
                        </svg>
                    </button>
                    <div class="tool-divider"></div>
                    <div class="color-picker-wrapper">
                        <button id="color-picker-trigger" class="tool-btn no-padding wheel-trigger">
                            <svg viewBox="0 0 24 24" class="pixel-wheel">
                                <path d="M12 2v10h10a10 10 0 0 0-10-10z" fill="#ff0000" />
                                <path d="M12 2a10 10 0 0 0-10 10h10V2z" fill="#ffff00" />
                                <path d="M2 12a10 10 0 0 0 10 10V12H2z" fill="#00ff00" />
                                <path d="M12 12v10a10 10 0 0 0 10-10H12z" fill="#0000ff" />
                                <circle cx="12" cy="12" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" />
                            </svg>
                        </button>
                        <input type="color" id="native-color-picker" value="#2d3436" style="display:none">
                    </div>
                    <div id="color-preview" class="sketchy-preview"></div>
                    <div class="tool-divider"></div>
                    <div class="thickness-group">
                        <span class="thickness-label">stroke thickness</span>
                        <div class="thickness-slider-wrap">
                            <span class="value-hint">2</span>
                            <input type="range" id="size-slider" min="2" max="24" value="8" step="1">
                            <span class="value-hint" id="current-size-hint">8</span>
                        </div>
                        <span class="thickness-footer">pixels</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="user-info">
                <div id="current-user-avatar" class="pixel-avatar-tiny"></div>
                <span id="current-user-nickname">anonymous</span>
            </div>
            <div class="stats">
                <span id="trace-count">0</span> traces in this world
            </div>
        </footer>
    </div>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="app.js" type="module"></script>
</body>

</html>
